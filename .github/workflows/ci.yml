name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**', 'integration/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Database, API and web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: AI service environment (used by the intelligence API tests)
        run: cd apps/ai-service && python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: AI service tests (pytest)
        run: cd apps/ai-service && .venv/bin/python -m pytest -q
      - name: Build shared packages
        run: pnpm --filter @resuto/contracts build && pnpm --filter @resuto/integrations build
      - name: Contracts and integration adapter tests
        run: pnpm --filter @resuto/contracts test && pnpm --filter @resuto/integrations test
      - name: Database security tests (RLS, constraints)
        run: node --test supabase/tests/*.test.mjs
      - name: Legacy data migration tool tests
        env:
          LEGACY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test_legacy
        run: node --test tools/legacy-migration/test/*.test.mjs
      - name: Demo data integrity check (unit tests + one defect case per assertion)
        env:
          DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test_demo_integrity
        run: node --test scripts/demo/test/*.test.mjs
      - name: Staging evidence and visual comparison script tests
        run: node --test scripts/staging/test/*.test.mjs scripts/ui/test/*.test.mjs
      - name: API typecheck
        run: pnpm --filter @resuto/api typecheck
      # PS-19/PS-23: GET /v1/openapi.json is generated from the router; fails when a controller route is missing from it,
      # when docs/api/openapi.json drifts (regenerate: UPDATE_OPENAPI=1 npx vitest run test/openapi.test.ts in apps/api)
      # or when a route breaks docs/API_STYLE.md (action POSTs answer 200, bounded list limits with a cursor, no examples).
      - name: API contract (OpenAPI 3.1 drift and style lint, error envelope)
        run: cd apps/api && npx vitest run test/openapi.test.ts test/error-contract.test.ts
      # 21-POSAPI: /v1 changes are additive only (docs/api/IPAD_COMPATIBILITY.md). Pull requests compare with the base
      # branch's document, pushes with the commit before the push (skipped for a new branch).
      - name: API contract is additive
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          node --test scripts/openapi/test/*.test.mjs
          if [ -n "$BASE_REF" ]; then git fetch --depth=1 origin "$BASE_REF" && BASE=FETCH_HEAD;
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then git fetch --depth=1 origin "$BEFORE_SHA" && BASE=FETCH_HEAD;
          else BASE=; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE:docs/api/openapi.json" 2>/dev/null; then
            git show "$BASE:docs/api/openapi.json" > "$RUNNER_TEMP/openapi.base.json"
            node scripts/openapi/additive.mjs "$RUNNER_TEMP/openapi.base.json" docs/api/openapi.json
          else echo "No base OpenAPI document to compare with"; fi
      - name: API integration tests
        run: pnpm --filter @resuto/api test
      # PS-16: the same suite with the API connected as the NOINHERIT, NOBYPASSRLS resuto_api login (per-run password on
      # this disposable cluster), proving no request path needs the owner or BYPASSRLS.
      - name: API integration tests as the restricted runtime role
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test_restricted
        run: cd apps/api && npx vitest run -c vitest.restricted.config.ts
      - name: MCP server tests (SDK client end-to-end against the API)
        env:
          MCP_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test_mcp
          MCP_OAUTH_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_test_mcp_oauth
        run: pnpm --filter @resuto/mcp-server test
      - name: Web unit tests (query cache, Western-digits policy, floor model)
        run: pnpm --filter @resuto/web test
      - name: Web build (type-checks every page)
        run: pnpm --filter @resuto/web build
      # First-load JS per route group from the build above (PCL-07); fails when a route grows past its group's budget.
      # Green on this base: the four routes already over their group budget are held at their measured size by
      # ROUTE_RATCHETS (scripts/ui/bundle-budget.mjs), so they cannot grow and the rest of each group keeps its budget.
      - name: Web bundle budget
        run: node scripts/ui/bundle-budget.mjs --json bundle-budget.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-budget
          path: bundle-budget.json
          if-no-files-found: ignore
          retention-days: 14
      # Independent of the bundle budget: runs even when an earlier step failed, so a red gate never hides the audit.
      - name: Dependency audit (production dependencies, high and above)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  browser:
    name: Browser end-to-end (Playwright, real API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resuto_e2e
      RESUTO_ALLOW_AUTH_SHIM: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @resuto/contracts build && pnpm --filter @resuto/integrations build
      # WebKit runs the phone-first guest and driver flows on an iPhone 13 profile (CR-10, project webkit-iphone-13).
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      # Pixel baselines are compared only where fonts are pinned: the "visual" job below (Playwright Docker image).
      # Here the runner's fonts differ from every recorded environment, so this job checks behaviour only.
      - name: Playwright (API, worker and built web app started by the config)
        env:
          E2E_WEBKIT: '1'
        run: pnpm e2e --ignore-snapshots
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  visual:
    name: Visual parity (Playwright Docker image, pinned fonts)
    runs-on: ubuntu-latest
    # The official image pins the browser build, system fonts and rendering libraries, so screenshots are reproducible
    # (CR-11). Baselines for this environment live in tests/e2e/__visual__/docker and tests/e2e/__screenshots__/docker.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@postgres:5432/resuto_e2e
      E2E_VISUAL: '1'
      E2E_SNAPSHOT_ENV: docker
      RESUTO_ALLOW_AUTH_SHIM: '1'
      # The service container is reached as "postgres", not localhost: let the e2e starter create and reset this
      # throwaway database (scripts/db/ensure-db.mjs, migrate.mjs --reset refuse any other non-local database).
      RESUTO_DISPOSABLE_DB: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @resuto/contracts build && pnpm --filter @resuto/integrations build
      # Committed baselines are enforced (1 % tolerance, animations off, fixed clock, dynamic text masked). A surface
      # without a docker baseline yet is recorded (tests/e2e/fixtures.ts matchScreenshot) and uploaded below for
      # approval instead of failing the run; record the approval in docs/ui/visual-baselines.json and commit the image.
      # NOTE: no docker baseline is committed yet, so this job only records today (CR-11 partial); once approved
      # baselines are committed, drop E2E_RECORD_MISSING_BASELINES so a missing surface fails the job too.
      # (Playwright 1.56's --update-snapshots=missing writes the file but fails the test, so it is not used.)
      - name: Visual snapshots (restored surfaces + landing/studio snapshots)
        env:
          E2E_RECORD_MISSING_BASELINES: '1'
        run: pnpm e2e --project=visual --project=chromium --grep "visual|public surfaces|restaurant and guest surfaces|staff surfaces"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-baselines
          path: |
            tests/e2e/__visual__/docker/
            tests/e2e/__screenshots__/docker/
            test-results/
          retention-days: 14

  legacy:
    name: Legacy application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # The root package.json names pnpm; this job uses npm in legacy/ and installs no pnpm.
          package-manager-cache: false
      - run: npm ci
      - run: npm test
