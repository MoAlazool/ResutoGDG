name: Native iPad POS
on:
  push:
    branches: [feature/ipad-pos]
    paths: ['apps/ipad-pos/**', '.github/workflows/ipad-pos.yml', 'packages/contracts/src/**', 'docs/api/openapi.json']
  pull_request:
    branches: [feature/ipad-pos]
    paths: ['apps/ipad-pos/**', '.github/workflows/ipad-pos.yml', 'packages/contracts/src/**', 'docs/api/openapi.json']
  workflow_dispatch:
    inputs:
      visual_only:
        description: Capture the current native UX review flow only
        type: boolean
        default: false
      capture_label:
        description: Screenshot evidence label
        type: string
        default: review
permissions:
  contents: read
concurrency:
  group: ipad-pos-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Report selected Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available
      - name: Verify generated sources and API contracts
        run: |
          python3 apps/ipad-pos/scripts/generate_permissions.py
          python3 apps/ipad-pos/scripts/generate_project.py
          python3 apps/ipad-pos/scripts/check_contracts.py
          python3 apps/ipad-pos/scripts/check_pos_contracts.py
          python3 apps/ipad-pos/scripts/check_ui_transport.py
          git diff --exit-code -- apps/ipad-pos
      - name: Test portable core
        working-directory: apps/ipad-pos
        run: swift test --parallel
      - name: Select an installed iPad simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          ipads=[d for runtime,group in devices.items() if 'iOS' in runtime for d in group if 'iPad' in d['name'] and d.get('isAvailable')]
          if not ipads: raise SystemExit('No available iPad simulator; inspect toolchain inventory above')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('IPAD_UDID='+ipads[0]['udid']+'\n')
          PY
      - name: Build Release without simulator test fixtures
        run: |
          set -o pipefail
          xcodebuild -project apps/ipad-pos/ResutoPOS.xcodeproj -scheme ResutoPOS -configuration Release -destination "platform=iOS Simulator,id=$IPAD_UDID" -derivedDataPath apps/ipad-pos/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual AppIdentifierPrefix=RESUTOTEST. build | tee apps/ipad-pos/release-build.log
      - name: Build and run native UI tests
        env:
          CAPTURE_LABEL: ${{ inputs.capture_label || 'review' }}
          VISUAL_ONLY: ${{ inputs.visual_only || false }}
        run: |
          set -o pipefail
          python3 apps/ipad-pos/scripts/capture_simulator.py --device "$IPAD_UDID" --output apps/ipad-pos/ui-screenshots --label "$CAPTURE_LABEL" > apps/ipad-pos/capture.log 2>&1 &
          CAPTURE_PID=$!
          trap 'kill "$CAPTURE_PID" 2>/dev/null || true' EXIT
          EXTRA_TEST_ARGS=()
          if [ "$VISUAL_ONLY" = "true" ]; then EXTRA_TEST_ARGS=(-only-testing:ResutoPOSUITests/VisualReviewTests); fi
          xcodebuild -project apps/ipad-pos/ResutoPOS.xcodeproj -scheme ResutoPOS -destination "platform=iOS Simulator,id=$IPAD_UDID" -parallel-testing-enabled NO -derivedDataPath apps/ipad-pos/DerivedData -resultBundlePath apps/ipad-pos/NativeResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual AppIdentifierPrefix=RESUTOTEST. "${EXTRA_TEST_ARGS[@]}" test | tee apps/ipad-pos/xcodebuild.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d apps/ipad-pos/NativeResults.xcresult ]; then
            xcrun xcresulttool export attachments --path apps/ipad-pos/NativeResults.xcresult --output-path apps/ipad-pos/ui-artifacts || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: native-ipad-results
          path: |
            apps/ipad-pos/*.xcresult
            apps/ipad-pos/xcodebuild.log
            apps/ipad-pos/release-build.log
            apps/ipad-pos/ui-artifacts/
            apps/ipad-pos/ui-screenshots/
            apps/ipad-pos/capture.log
          if-no-files-found: warn
